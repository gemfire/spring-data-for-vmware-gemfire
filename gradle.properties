group = com.vmware.gemfire
version=2.0.0-build.9999

description = 'Spring Data for VMware GemFire'

minimumGradleVersion = 9.5

# These two properties drive artifact naming (e.g. spring-data-4.1-gemfire-10.3).
# They are separate from the dependency versions defined in gradle/libs.versions.toml.
baseGemFireVersion=10.4
baseSpringVersion=4.1


org.gradle.parallel=true
org.gradle.workers.max=3

springTestGemfireDockerImage=gemfire/gemfire:10.4-jdk17

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
