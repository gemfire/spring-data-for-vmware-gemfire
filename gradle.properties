group = com.vmware.gemfire
version = 1.0.3-build.9999

additionalMavenRepoURLs=''

description = 'Spring Data for VMware GemFire'

minimumGradleVersion = 8.5

# These two properties drive artifact naming (e.g. spring-data-2.7-gemfire-10.1).
# They are separate from the dependency versions defined in gradle/libs.versions.toml.
baseGemFireVersion=10.1
baseSpringVersion=2.7

spring.gemfire.enable.private.repositories=false

org.gradle.parallel=true
org.gradle.workers.max=3

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
